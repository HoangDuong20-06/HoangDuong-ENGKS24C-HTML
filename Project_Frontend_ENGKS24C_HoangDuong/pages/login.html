<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/Project_Frontend_ENGKS24C_HoangDuong/css/login.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body id="body">
    <h1>Đăng nhập</h1>
    <div id="loginMenu">
        <label for="email">Email</label>
        <input type="email" id="emailLogin" placeholder="Email">
        <p id="errorEmail" class="error"></p>
        <label for="password">Mật khẩu</label>
        <input type="password" name="pass" id="passLogin" placeholder="Mật khẩu">
        <p id="errorPass" class="error"></p>
        <button id="loginButton">Đăng nhập</button>
        <p>Chưa có tài khoản?<a href="register.html" id="registerLink">Đăng ký</a></p>
    </div>
    <script src="/Project_Frontend_ENGKS24C_HoangDuong/js/login.js"></script>
</body>
</html>

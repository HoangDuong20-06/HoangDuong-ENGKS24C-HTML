<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/Project_Frontend_ENGKS24C_HoangDuong/css/register.css">
</head>
<body id="body">
    <h1>Đăng ký</h1>
    <div id="registerMenu">
        <input type="text" id="name" placeholder="Họ tên">
        <p id="errorName" class="error"></p>
        <input type="email" id="emailRegis" placeholder="Địa chỉ email">
        <p id="errorEmail" class="error"></p>
        <input type="password" name="pass" id="passRegis" placeholder="Mật khẩu">
        <p id="errorPass" class="error"></p>
        <input type="password" name="confirmPass" id="confirmPass" placeholder="Xác nhận mật khẩu">
        <p id="errorConfirm" class="error"></p>
        <button id="registerButton">Đăng ký</button>
        <p>Đã có tài khoản?<a href="login.html" id="registerLink">Đăng nhập</a></p>
    </div>
    <script src="/Project_Frontend_ENGKS24C_HoangDuong/js/register.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Bài4thaychua.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
          <h1 class="row text-bg-secondary">Quản lý nhân viên</h1>
        </div>
        <form class="row g-3">
          <div class="col-auto">
            <label for="employee-name" class="visually-hidden"
              >Tên nhân viên</label
            >
            <input
              type="text"
              class="form-control"
              id="employee-name"
              placeholder="Tên nhân viên"
            />
          </div>
          <div class="col-auto">
            <label for="employee-position" class="visually-hidden">Chức vụ</label>
            <input
              type="text"
              class="form-control"
              id="employee-position"
              placeholder="Chức vụ"
            />
          </div>
          <div class="col-auto">
            <button class="btn btn-primary mb-3">Thêm nhân viên</button>
          </div>
        </form>
      </div>
  
      <div class="container">
        <table class="table table-striped">
          <thead>
            <tr>
              <th scope="col">Số thứ tự</th>
              <th scope="col">Tên</th>
              <th scope="col">Chức vụ</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">1</th>
              <td>Mark</td>
              <td>Otto</td>
            </tr>
            <tr>
              <th scope="row">2</th>
              <td>Jacob</td>
              <td>Thornton</td>
            </tr>
            <tr>
              <th scope="row">3</th>
              <td colspan="2">Larry the Bird</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="container">
        <nav aria-label="Page navigation example">
          <ul class="pagination">
            <li class="page-item"><a class="page-link" href="#">Previous</a></li>
            <li class="page-item"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item"><a class="page-link" href="#">Next</a></li>
          </ul>
        </nav>
      </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Bài4thaychua.js"></script>
</body>
</html>

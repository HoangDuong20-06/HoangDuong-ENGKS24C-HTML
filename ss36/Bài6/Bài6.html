<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hệ thống đánh giá sản phẩm</title>
    <link rel="stylesheet" href="Bài6.css" />
  </head>
  <body>
    <div class="modal">
      <div class="modal-content">
          <h2>Thêm/sửa nhiệm vụ</h2>
          <form id="task-form">
              <label for="task-name">Tên nhiệm vụ</label>
              <input type="text" id="task-name" placeholder="Nhập tên nhiệm vụ" required>
              <small class="error-message">Tên nhiệm vụ đã tồn tại</small>

              <label for="assignee">Người phụ trách</label>
              <select id="assignee">
                  <option value="">Chọn người phụ trách</option>
              </select>

              <label for="status">Trạng thái</label>
              <select id="status">
                  <option value="">Chọn trạng thái nhiệm vụ</option>
              </select>

              <label for="start-date">Ngày bắt đầu</label>
              <input type="date" id="start-date">

              <label for="end-date">Hạn cuối</label>
              <input type="date" id="end-date">

              <label for="priority">Độ ưu tiên</label>
              <select id="priority">
                  <option value="">Chọn độ ưu tiên</option>
              </select>

              <label for="progress">Tiến độ</label>
              <select id="progress">
                  <option value="">Chọn tiến độ</option>
              </select>

              <div class="buttons">
                  <button type="button" class="cancel" onclick="cancelForm()">Hủy</button>
                  <button type="button" class="save" onclick="saveTask()">Lưu</button>
              </div>
          </form>
      </div>
  </div>
    <script src="Bài6.js"></script>
  </body>
</html>
